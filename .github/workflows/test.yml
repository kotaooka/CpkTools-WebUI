# プッシュ時に工程能力指数の計算（capability.py）を検証する
name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy
      - name: 工程能力指数の検証
        run: python tests/test_capability.py
